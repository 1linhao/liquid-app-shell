name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 1linhao/liquid-ui
          path: liquid-ui
      - uses: actions/checkout@v4
        with:
          path: liquid-app-shell
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: npm ci
        working-directory: liquid-ui
      - run: npm run build
        working-directory: liquid-ui
      - run: pnpm install --frozen-lockfile
        working-directory: liquid-app-shell
      - run: pnpm check
        working-directory: liquid-app-shell
      - run: npm pack --dry-run
        working-directory: liquid-app-shell
